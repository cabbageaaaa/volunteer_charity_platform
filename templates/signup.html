  {% extends 'base.html' %}

{% block title %}Sign Up - Volunteer & Charity Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Sign Up</h4>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs mb-4" id="signupTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="volunteer-tab" data-bs-toggle="tab" data-bs-target="#volunteer" type="button" role="tab">Volunteer</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="charity-tab" data-bs-toggle="tab" data-bs-target="#charity" type="button" role="tab">Charity</button>
                    </li>
                </ul>
                
                <div class="tab-content" id="signupTabContent">
                    <!-- Volunteer Sign Up Form -->
                    <div class="tab-pane fade show active" id="volunteer" role="tabpanel">
                        <form method="post" action="{{ url_for('signup') }}">
                            <input type="hidden" name="user_type" value="volunteer">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="first_name" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="last_name" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="volunteer_username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="volunteer_username" name="username" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="volunteer_email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="volunteer_email" name="email" required>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="volunteer_password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="volunteer_password" name="password" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="volunteer_confirm_password" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="volunteer_confirm_password" name="confirm_password" required>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Sign Up as Volunteer</button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- Charity Sign Up Form -->
                    <div class="tab-pane fade" id="charity" role="tabpanel">
                        <form method="post" action="{{ url_for('signup') }}">
                            <input type="hidden" name="user_type" value="charity">
                            
                            <div class="mb-3">
                                <label for="charity_name" class="form-label">Charity Name</label>
                                <input type="text" class="form-control" id="charity_name" name="charity_name" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="charity_username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="charity_username" name="username" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="charity_email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="charity_email" name="email" required>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="charity_password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="charity_password" name="password" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="charity_confirm_password" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="charity_confirm_password" name="confirm_password" required>
                                </div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Sign Up as Charity</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="mt-3 text-center">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
