{% extends 'base.html' %}

{% block title %}Admin Login - Volunteer & Charity Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Administrator Login</h4>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Admin Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark">Login as Administrator</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <p>Not an administrator? <a href="{{ url_for('login') }}">Regular Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
